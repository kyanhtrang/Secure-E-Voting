name: Admin election management disposable gate
"on":
  push:
    branches: [feat/admin-election-management]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-management:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.9"
      - name: Locked installation and database-free regression
        run: |
          umask 077
          python -m venv "$RUNNER_TEMP/admin-python"
          admin_python="$RUNNER_TEMP/admin-python/bin/python"
          printf 'EVOTE_TEST_PYTHON=%s\n' "$admin_python" >> "$GITHUB_ENV"
          "$admin_python" -m pip install --no-deps -r backend/voting/requirements.lock.txt
          "$admin_python" -m pip check
          "$admin_python" scripts/voting_postgres_ci.py --verify-dependencies
          npm --prefix frontend ci --ignore-scripts
          npm --prefix crypto_interop ci --ignore-scripts
          npm --prefix crypto_interop run build
          EVOTE_TEST_NODE="$(command -v node)" "$admin_python" -m pytest tests/ crypto_interop/ -q
          node --test crypto_interop/dist/pending_state.test.js
      - name: Frontend and synthetic Admin browser regression
        working-directory: frontend
        run: |
          npm run build
          npm test
          npx --no-install playwright install --with-deps chromium
          npm run test:browser
          npm run test:voting-browser
          npm run test:admin-browser
      - name: Real separate RA and Voting PostgreSQL 18 Admin contracts
        run: |
          "$EVOTE_TEST_PYTHON" scripts/admin_postgres_ci.py --allow-ephemeral-ci-databases
      - name: Source and dependency lock integrity
        run: |
          git diff --exit-code
          git diff --check
