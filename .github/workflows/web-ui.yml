name: Web UI foundation

"on":
  push:
    branches: [main, feat/web-ui-foundation, feat/voter-voting-ui]
    paths: ["frontend/**", "backend/ra/**", "tests/demo_auth_helpers.py", ".github/workflows/web-ui.yml"]
  pull_request:
    paths: ["frontend/**", "backend/ra/**", "tests/demo_auth_helpers.py", ".github/workflows/web-ui.yml"]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
      - name: Install locked fixture and frontend dependencies
        run: |
          python -m venv "$RUNNER_TEMP/web-python"
          "$RUNNER_TEMP/web-python/bin/python" -m pip install --no-deps -r backend/ra/credential-requirements.lock.txt
          "$RUNNER_TEMP/web-python/bin/python" -m pip check
          npm --prefix frontend ci --ignore-scripts
      - name: Compile and run component and API contract tests
        run: |
	  test -x "$EVOTE_TEST_PYTHON"
    	  "$EVOTE_TEST_PYTHON" -c "import rfc8785; from backend.crypto.credential_protocol import verify_credential"
          npm --prefix frontend run build
          npm --prefix frontend test
      - name: Install browser and test real HTTP auth with a synthetic in-memory database
        working-directory: frontend
        env:
          EVOTE_TEST_PYTHON: ${{ runner.temp }}/web-python/bin/python
        run: |
          npx --no-install playwright install --with-deps chromium
          npm run test:browser
          npm run test:voting-browser
      - name: Keep dependency locks and source unchanged
        run: |
          git diff --exit-code
          git diff --check
