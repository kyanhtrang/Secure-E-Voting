name: Anonymous Voting PostgreSQL integration

"on":
  push:
    branches: [feat/anonymous-voting-backend]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voting-postgres-integration:
    if: github.ref == 'refs/heads/feat/anonymous-voting-backend'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"

      - name: Set up Node.js 24 for existing crypto regression tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.3"
          package-manager-cache: false

      - name: Install and verify locked backend and crypto dependencies
        run: |
          umask 077
          python -m venv "$RUNNER_TEMP/voting-python"
          "$RUNNER_TEMP/voting-python/bin/python" -m pip install --no-deps -r backend/voting/requirements.lock.txt
          "$RUNNER_TEMP/voting-python/bin/python" -m pip check
          "$RUNNER_TEMP/voting-python/bin/python" scripts/voting_postgres_ci.py --verify-dependencies
          npm --prefix crypto_interop ci --ignore-scripts
          npm --prefix crypto_interop run build

      - name: Run all database-free backend and crypto tests
        run: |
          export EVOTE_TEST_NODE="$(command -v node)"
          "$RUNNER_TEMP/voting-python/bin/python" -m pytest tests/ crypto_interop/ -q
          node --test crypto_interop/dist/pending_state.test.js

      - name: Run actual Voting harness against owned ephemeral PostgreSQL 18
        # No services database, credentials, external target, or private-key input.
        run: |
          "$RUNNER_TEMP/voting-python/bin/python" scripts/voting_postgres_ci.py --allow-ephemeral-ci-database

      - name: Verify source and locks remain unchanged
        run: |
          git diff --exit-code
          git diff --check
