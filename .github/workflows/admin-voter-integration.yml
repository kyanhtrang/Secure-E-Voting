name: Real Admin-to-Voter integration

"on":
  push:
    branches: [test/admin-voter-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-voter-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOWORK: "off"
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.14"
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
      - name: Install and verify locked dependencies
        run: |
          umask 077
          python -m venv "$RUNNER_TEMP/admin-voter-python"
          gate_python="$RUNNER_TEMP/admin-voter-python/bin/python"
          printf 'EVOTE_TEST_PYTHON=%s\n' "$gate_python" >> "$GITHUB_ENV"
          "$gate_python" -m pip install --no-deps -r backend/voting/requirements.lock.txt
          "$gate_python" -m pip check
          "$gate_python" scripts/voting_postgres_ci.py --verify-dependencies
          npm --prefix frontend ci --ignore-scripts
          npm --prefix crypto_interop ci --ignore-scripts
          npm --prefix crypto_interop run build
      - name: Native CIRCL regression and runtime signer
        working-directory: crypto_interop/signer
        run: |
          go mod download
          go mod verify
          go test -count=1 ./...
          go build -o "$RUNNER_TEMP/admin-voter-circl-signer" ./cmd/ra-credential-signer
      - name: Complete database-free backend and crypto regression
        run: |
          export EVOTE_TEST_NODE="$(command -v node)"
          "$EVOTE_TEST_PYTHON" -m pytest tests/ crypto_interop/ -q
          node --test crypto_interop/dist/pending_state.test.js
      - name: Frontend and existing browser regressions
        working-directory: frontend
        run: |
          npm run check
          npm run build
          npm test
          npx --no-install playwright install --with-deps chromium
          npm run test:browser
          npm run test:voting-browser
          npm run test:admin-browser
      - name: Real Admin RA CIRCL Chromium Voting PostgreSQL gate
        run: |
          "$EVOTE_TEST_PYTHON" scripts/admin_voter_e2e.py \
            --allow-ephemeral-ci-databases \
            --node "$(command -v node)" \
            --signer-binary "$RUNNER_TEMP/admin-voter-circl-signer"
      - name: Source and dependency lock integrity
        run: |
          git diff --exit-code
          git diff --check
      - name: Remove owned test binary
        if: always()
        run: rm -f -- "$RUNNER_TEMP/admin-voter-circl-signer"
